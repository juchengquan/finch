name: CI

on:
  push:
    branches: [main, feat/frontend]
    # Skip CI for docs-only PUSHES (specs/plans/markdown). A mixed commit that
    # also touches code still runs — paths-ignore only skips when ALL changed
    # files match. Safe on push: branch protection gates pull requests, not
    # pushes, so skipping here can't leave a required check unreported.
    paths-ignore:
      - "**/*.md"
      - "plans/**"
  pull_request:
    # NO paths-ignore here, deliberately — the workflow must ALWAYS trigger so the
    # required status check gets reported. Docs-only PRs are made cheap a different
    # way: the `changes` job (below) detects whether any non-docs file changed, and
    # the `frontend` / `guards` jobs are gated on it. The required check
    # (`iOS + macOS (…)`) is carried by the always-running `ios-required` aggregate,
    # so a docs-only PR gets a green required check in seconds.
    #
    # Do NOT re-add paths-ignore here: it skips the whole workflow, the required
    # check never reports, and the PR blocks forever (a docs-only PR, #579, hit
    # exactly that — `checks: []`, state BLOCKED, admin-override only).
  # Fire the FULL suite (the `ios` job: build, tests, UI tests, macOS, watchOS)
  # on any branch, on demand — the pre-merge escape hatch for a risky change now
  # that pull requests no longer run Xcode at all (see the `ios` job).
  workflow_dispatch:

# The postmerge-alarm job files/updates an issue when a post-merge run goes red.
permissions:
  contents: read
  issues: write

# PR runs supersede each other per ref, as before. PUSH (and dispatch) runs each
# get a group of their own — the run id — so nothing cancels OR supersedes them.
# The post-merge run is the only systematic Apple-platform coverage now, and a
# shared no-cancel group would still lose runs: GitHub keeps at most ONE pending
# run per group, so a three-merge burst would silently drop the middle one.
# Per-run groups mean every merge gets covered; runs queue on runner scarcity
# instead of eating each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap gate: did this change touch anything other than docs (**/*.md, plans/**)?
  # The jobs below run only when it did. This is what makes a docs-only PR skip
  # the frontend build + guards without re-introducing the required-check
  # deadlock (see the pull_request comment above).
  changes:
    name: Detect non-docs changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the PR base commit present to diff against it
      - id: filter
        # `code=true` iff the PR changes at least one file that is NOT markdown and
        # NOT under plans/ (both are docs). A plain git diff, not dorny/paths-filter:
        # that action's `'**' + '!...'` negation does NOT exclude — every file still
        # matches `**`, so `code` was always true and docs-only PRs ran the full
        # macOS build anyway (the bug this fixes).
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Pushes: docs-only pushes are already dropped by on.push.paths-ignore,
            # so anything that reaches here is a code push — run everything.
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          echo "diffing $base...$head"
          changed="$(git diff --name-only "$base...$head")"
          echo "changed files:"; echo "$changed"
          # Non-empty list of files that are neither *.md nor under plans/ ⇒ code changed.
          # `|| true` so an all-docs diff (grep exits 1) doesn't fail the step under set -e.
          noncode="$(printf '%s\n' "$changed" | grep -vE '(\.md$|^plans/)' || true)"
          if [ -n "$noncode" ]; then
            echo "→ non-doc files changed; running full CI"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "→ docs-only; skipping the code jobs"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend (typecheck · lint · test · build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Naming check
        run: bun run check:naming

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  # The two i18n checks that need NO Xcode — seconds on a Linux runner. They
  # lived inside the macOS job until 2026-08-07; moving them here keeps them on
  # every PULL REQUEST after the Xcode work moved post-merge (see the `ios` job).
  # They also run on push, so the post-merge run keeps the same coverage.
  guards:
    name: Guards (i18n catalog + UIKit strings)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # UIKit takes plain String, so a user-facing literal there is never
      # extracted and ships English in every language with no other guard
      # failing. This is the migration's systemic l10n hazard; see
      # ios/docs/uikit-migration-plan.md.
      - name: i18n — UIKit strings are localized
        run: python3 ios/scripts/uikit-strings-guard.py

      # i18n guard 1 of 2 — the CHEAP one (no Xcode, seconds).
      # Localizable.xcstrings is GENERATED. Hand-editing it is what let 214
      # translations end up living only in the generated file, where a routine
      # regenerate silently destroyed 69 of them. Rebuild from the committed
      # inputs and fail if the result differs from what's checked in.
      # (Guard 2 of 2 — "extracted keys are current" — needs an Xcode compile,
      # so it stays in the `ios` job below.)
      - name: i18n — catalog is reproducible from its inputs
        working-directory: ios
        run: |
          bun run scripts/build-xcstrings.ts
          if ! git diff --quiet -- FinchApp/Sources/FinchShared/Resources/Localizable.xcstrings; then
            git diff --stat -- FinchApp/Sources/FinchShared/Resources/Localizable.xcstrings
            echo "::error file=ios/FinchApp/Sources/FinchShared/Resources/Localizable.xcstrings::Localizable.xcstrings does not match a fresh build from its inputs. It is GENERATED — put translations in ios/scripts/zh-manual.json, then run: bun run ios/scripts/build-xcstrings.ts"
            exit 1
          fi

  ios:
    # The full Apple-platform suite — POST-MERGE ONLY (plus workflow_dispatch).
    #
    # Pull requests stopped running Xcode entirely (2026-08-07). Two measured
    # reasons: the job itself is ~43 min (of which ~40 min is building the app
    # and driving 33 XCUITests on two simulators), and hosted macos-26 runners
    # queue 10 min–12 h before the first step runs — so ANY PR gate containing
    # xcodebuild inherits that queue no matter how fast the job is. The
    # pre-merge iOS gate is ios/scripts/ci-local.sh (warm, minutes) on the
    # developer's machine; this job is the cold, systematic safety net that
    # backstops it within one merge. For a risky change, fire it on the branch
    # first via workflow_dispatch instead of gating the PR on it.
    #
    # The required status check is carried by the always-running `ios-required`
    # aggregate below, so skipping this job on PRs leaves nothing unreported —
    # same mechanism that already covered docs-only PRs (#579).
    name: iOS full suite (build · tests · UI tests · macOS · watchOS)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    # iOS 26 SDK requires Xcode 26.x — use a runner image that ships it. Adjust
    # the image / Xcode selection here if the hosted images change.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git-restore-mtime can date each file

      # Stamp each source file with its last-commit mtime. Without this, checkout
      # marks every file "now" — newer than any cached build object — so Xcode and
      # SwiftPM recompile everything even with a warm cache, defeating the
      # DerivedData cache below. With it, only files changed in this push look
      # newer, so unchanged files reuse their cached objects (true incremental).
      - name: Restore source mtimes (enables incremental build caching)
        run: |
          # git-restore-mtime is a standalone script (not on PyPI). Pinned to a
          # commit SHA for reproducibility/supply-chain safety.
          curl -fsSL -o /tmp/git-restore-mtime \
            https://raw.githubusercontent.com/MestreLion/git-tools/b5822d297b3ca4a3b6574e78327a464790b14937/git-restore-mtime
          python3 /tmp/git-restore-mtime ios

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install web deps + generate fixtures (Task 0 oracle)
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun scripts/export-fixtures.ts

      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"

      # Cache the SwiftPM build (GRDB et al.) so `swift test` doesn't recompile
      # dependencies from scratch each run. Keyed on the resolved dependency
      # graph; our own sources still rebuild incrementally.
      - name: Cache SwiftPM build (swift test)
        uses: actions/cache@v4
        with:
          path: |
            ios/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: FinchCore unit tests + ParityTests (swift test)
        working-directory: ios
        run: swift test

      # Two specs, two projects: FinchApp.xcodeproj (iOS/watch/extensions) and
      # FinchMac.xcodeproj (macOS). They are deliberately separate — see the
      # header of ios/project-mac.yml.
      - name: Generate the Xcode projects
        working-directory: ios
        run: xcodegen generate --spec project.yml,project-mac.yml

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9][0-9A-Za-z ]*' | head -1 | xargs)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"

      # An iPad too — the regular-width UI tests assert nothing on a phone (see the
      # step below). Parsed from JSON rather than grepped: iPad device names contain
      # parentheses of their own ("iPad Pro 11-inch (M4)"), so the `grep -oE` trick
      # used above truncates them at the first bracket and yields a name that matches
      # no device. This strips the UDID and state instead, keeping the whole name.
      # Fails loudly when no iPad runtime is installed, because the whole point of
      # this pair of steps is that silence is not coverage.
      - name: Pick an available iPad simulator
        id: ipad
        run: |
          NAME=$(xcrun simctl list devices available \
            | sed -E 's/^[[:space:]]+//; s/ \([0-9A-F-]{36}\).*$//' \
            | grep '^iPad' | head -1)
          if [ -z "$NAME" ]; then
            echo "::error::No iPad simulator available on this runner — the regular-width tests cannot run."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using iPad simulator: $NAME"

      # Cache Xcode's resolved SwiftPM checkouts so the FinchApp/FinchMac builds
      # don't re-clone/re-resolve GRDB et al. Both xcodebuild steps share one
      # -derivedDataPath (/tmp/dd).
      - name: Cache Xcode SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: /tmp/dd/SourcePackages
          key: xcspm-${{ runner.os }}-${{ hashFiles('ios/Package.resolved') }}
          restore-keys: |
            xcspm-${{ runner.os }}-

      # EXPERIMENT: cache Xcode's compiled intermediates (.o / .swiftmodule +
      # per-file incremental build records) + the clang module cache so the three
      # app builds recompile only what changed instead of from scratch. Only the
      # Intermediates are cached (not the large linked Products, which relink
      # cheaply from cached objects). Rolling key (github.sha never matches, so a
      # fresh cache saves each run) + restore-keys to pull the most recent one.
      # Effectiveness hinges on the mtime restore above — measured before keeping.
      - name: Cache Xcode DerivedData (incremental compile)
        uses: actions/cache@v4
        with:
          path: |
            /tmp/dd/Build/Intermediates.noindex
            /tmp/dd/ModuleCache.noindex
          key: dd-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            dd-${{ runner.os }}-

      # `-retry-tests-on-failure` re-runs ONLY the tests that failed, up to
      # `-test-iterations` attempts each. A green run pays nothing — retries are
      # spent on failure alone, so this costs time exactly when time was already
      # going to be lost to a re-run.
      #
      # WHY: FinchAppUITests drives a simulator through XCUITest, and it fails
      # spuriously at roughly 1 run in 12 — measured across 25 consecutive runs
      # (2026-08-01). Both failures were NavigationUIKitUITests on the Accounts
      # drill, and one is PROVABLY transient: #678's PR run failed
      # `testAccountsDrillIntoAccountDetail` ("the drill didn't open"), and the
      # merge commit of that identical code passed minutes later (c9e29f18).
      # #680 hit the other shape — drill and sheet both succeeded, then the app
      # died mid-retry with "Lost connection to the application
      # (mach_error=10000003)" while XCTest re-snapshotted the accessibility
      # tree at 20-30s an attempt. Re-running that job unchanged went green.
      #
      # THIS MASKS AN INTERMITTENT PRODUCT BUG AS READILY AS A HARNESS ONE, and
      # both observed failures were UIKit-mode Accounts drills — the surface the
      # migration is actively converting. If a test starts needing its retry on
      # most runs, the retry is hiding a race in the conversion, not absorbing
      # simulator noise. Read the result bundle before assuming noise.
      #
      # `-test-repetition-relaunch-enabled YES` IS LOAD-BEARING, not a tuning knob.
      # Without it xcodebuild repeats a test IN THE SAME PROCESS (its documented
      # default), and #680's failure mode was precisely a dead process plus a
      # poisoned testmanagerd connection — "Couldn't communicate with a helper
      # application … peer may have been unloaded". Retrying in the same runner is
      # retrying into the wreckage. The tests already relaunch the APP under test
      # in setUpWithError; this relaunches the RUNNER, which is the half that died.
      #
      # `-test-iterations 3` is the documented default for -retry-tests-on-failure
      # and is stated anyway, so the ceiling is visible here rather than inherited.
      #
      # Scoped to the whole step because the unit tests and the UI tests share it
      # today. The 328 FinchAppTests run in 12s and have not flaked, so the blast
      # radius is small; splitting the UI tests into their own step is what would
      # confine this to the target that needs it.
      - name: Build + test FinchApp
        working-directory: ios
        run: |
          xcodebuild test -project FinchApp.xcodeproj -scheme FinchApp \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath /tmp/dd \
            -retry-tests-on-failure -test-iterations 3 \
            -test-repetition-relaunch-enabled YES \
            -skipPackagePluginValidation -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO

      # The iPad half of the split shell, which NOTHING was running until now.
      #
      # `SplitSelectionUITests`, its hosted twin and `SplitMechanicsUITests` all call
      # `XCTSkipUnless(width >= 700)`, so on the iPhone destination above they skip —
      # every one of them. That is green because it did nothing, which is the most
      # expensive kind of green: `SplitSelectionUITests` has been shipping "passes in
      # CI" since it was written while only ever really running on someone's local
      # iPad. Phase 3b put five converted tab roots behind exactly those assertions.
      #
      # `test-without-building` is what makes this cheap: the products in /tmp/dd from
      # the step above are simulator builds and run on an iPad destination unchanged,
      # so this adds test TIME (~2 minutes for 8 tests, measured) and no build time.
      # Re-running the whole suite on a second destination would have roughly doubled
      # the job for no extra coverage — the unit tests are width-agnostic.
      #
      # Same retry flags as the iPhone step, for the same reason: these are XCUITest
      # and the flake rate documented above applies to them too.
      - name: Test the split shell on an iPad (regular width)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test-without-building -project FinchApp.xcodeproj -scheme FinchApp \
            -destination "platform=iOS Simulator,name=${{ steps.ipad.outputs.name }}" \
            -derivedDataPath /tmp/dd \
            -only-testing:FinchAppUITests/SplitMechanicsUITests \
            -only-testing:FinchAppUITests/SplitSelectionUITests \
            -only-testing:FinchAppUITests/SplitSelectionHostedUITests \
            -retry-tests-on-failure -test-iterations 3 \
            -test-repetition-relaunch-enabled YES \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee /tmp/ipad-tests.log
          # A run where every case skipped is the failure this step exists to prevent,
          # and xcodebuild reports it as success. If the width guard stops matching —
          # a new iPad that reports compact, a renamed class in -only-testing — this
          # catches it instead of quietly restoring the old blind spot.
          if ! grep -qE "Test Case .* passed \(" /tmp/ipad-tests.log; then
            echo "::error::No iPad test actually ran — every case skipped. This step is not providing coverage."
            exit 1
          fi

      # i18n guard 2 of 2 — needs a compile, so it runs here where /tmp/dd is
      # already warm from the build above (guard 1, which needs no Xcode, moved
      # to the `guards` job so pull requests keep it). Catches the OTHER failure
      # mode: a new UI string that never reaches extracted-keys.json is absent
      # from the catalog entirely and silently renders English. That is how a
      # 70-string backlog accumulated before anyone noticed.
      - name: i18n — extracted keys are current
        working-directory: ios
        run: |
          # Run-scoped export dir, passed explicitly to xliff-keys.ts. A CI runner is
          # isolated so a fixed path is safe HERE, but the script no longer accepts an
          # implicit one — locally that default let a failed export fall through to
          # another worktree's xliff and report a wrong key set.
          LOC_DIR="$(mktemp -d)"
          xcodebuild -exportLocalizations -project FinchApp.xcodeproj -scheme FinchApp \
            -localizationPath "$LOC_DIR" -exportLanguage zh-Hans \
            -derivedDataPath /tmp/dd -quiet \
            -skipPackagePluginValidation -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO
          bun run scripts/xliff-keys.ts "$LOC_DIR" > "$LOC_DIR/keys-fresh.json"
          # Compare the KEY SET, not the file bytes: what matters is whether any
          # UI string is missing from the catalog, and a set diff also names the
          # offenders instead of printing "N insertions" and leaving you guessing.
          python3 - "$LOC_DIR/keys-fresh.json" <<'PYEOF'
          import json, sys
          fresh = set(json.load(open(sys.argv[1])))
          committed = set(json.load(open("scripts/extracted-keys.json")))
          missing = sorted(fresh - committed)   # in the app, absent from the catalog
          stale   = sorted(committed - fresh)   # in the catalog, gone from the app
          if not missing and not stale:
              sys.exit(0)
          for k in missing:
              print(f"  + {k!r}  (in the app, NOT in the catalog -> renders English)")
          for k in stale:
              print(f"  - {k!r}  (in the catalog, no longer in the app)")
          print("::error file=ios/scripts/extracted-keys.json::extracted-keys.json is out of "
                "date with the app's strings (see the +/- list above). Re-run the pipeline in "
                "the header of ios/scripts/build-xcstrings.ts, then commit extracted-keys.json "
                "AND the rebuilt catalog.")
          sys.exit(1)
          PYEOF

      # macOS-only breaks the iOS build cannot catch — e.g. `.topBarTrailing` is
      # unavailable on macOS. Build-only (no signing) — a compile gate, not a release.
      #
      # This used to carry its own `if: push` while the rest of the job gated PRs;
      # the WHOLE job is post-merge now, so the step runs whenever the job does.
      #
      # THIS ONLY WORKS BECAUSE FinchMac LIVES IN ITS OWN PROJECT. While it was a
      # target in FinchApp.xcodeproj, `xcodebuild -exportLocalizations` (the i18n step
      # above) compiled it on every run regardless of `-scheme`, `-target` or
      # `-destination` — all three were tried — so a macOS break failed that step with
      # exit 64 and skipping this one only changed the error message. Splitting the
      # projects is what actually decoupled them; measured before and after.
      # Do NOT move FinchMac back into project.yml without re-reading this.
      #
      # NOT deleted even though macOS is parked: FinchMac is the only target that
      # compiles `FinchAppSwiftUI/FinchApp.swift` (the SwiftUI `@main`, which iOS
      # excludes) plus every SwiftUI screen the migration drops from iOS via
      # `excludes:` — a surface that GROWS with each conversion.
      - name: Build FinchMac (macOS)
        working-directory: ios
        run: |
          xcodebuild build -project FinchMac.xcodeproj -scheme FinchMac \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath /tmp/dd-mac \
            -skipPackagePluginValidation -skipMacroValidation -quiet \
            COMPILER_INDEX_STORE_ENABLE=NO

      # Compile the watch app + its complication extension (Watch CP1/CP2) —
      # neither is covered by the FinchApp/FinchMac builds, and watchOS-only
      # APIs (WidgetKit accessory families, WCSession receive side) can break
      # silently otherwise. Build-only compile gate, no watch tests.
      #
      # Like FinchMac above, this ran post-merge via its own `if: push` while the
      # job still gated PRs; the whole job is post-merge now. The old caveat here
      # — cancel-in-progress eating a merge's watch build when merges landed
      # back-to-back — is gone with it: push runs no longer share a concurrency
      # group (see the top of the file), so every merge's run reports.
      #
      # NOT deleted: watchOS work resumes later, and this is the only build of
      # the watch app + complication extension anywhere.
      - name: Build FinchWatch (watchOS)
        working-directory: ios
        run: |
          xcodebuild build -project FinchApp.xcodeproj -scheme FinchWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath /tmp/dd \
            -skipPackagePluginValidation -skipMacroValidation -quiet \
            COMPILER_INDEX_STORE_ENABLE=NO

  # The REQUIRED status check on feat/frontend. Its NAME is what branch protection
  # requires, so it must ALWAYS run and always report — hence `if: always()` and a
  # cheap ubuntu runner. On a pull request it passes iff `frontend` and `guards`
  # succeeded (or were skipped — docs-only PR); the `ios` job is ALWAYS skipped on
  # PRs by design since 2026-08-07 (see its comment), which this treats the same
  # as the docs-only skip. `frontend` and `guards` are in the gate because they
  # are what a PR actually runs now — before this, frontend wasn't required at
  # all, so a red frontend could merge.
  #
  # KEEP THIS JOB'S `name:` EXACTLY EQUAL to the required-check context configured
  # in branch protection. If you rename it, update branch protection in lockstep,
  # or every PR blocks forever waiting on a status that no longer reports.
  #
  # THE NAME IS NOW WRONG ON PURPOSE, and more so than before: it still says
  # `iOS + macOS (…)`, but a PR passing this check has compiled NEITHER — the
  # whole Apple-platform suite is post-merge. The name is a branch-protection
  # CONTRACT string, not a description, and renaming it in place is precisely
  # the #579 failure mode — so it stays. The job names say what actually ran.
  #
  # If it must be renamed, do it with NO blocking window:
  #   1. merge a change that adds a SECOND aggregate job under the new name
  #      (both then report on every PR);
  #   2. update branch protection to require the new name and drop the old;
  #   3. merge a change deleting the old aggregate job.
  # Renaming in place instead means whichever side you change first leaves the
  # required context unreported, and every PR shows BLOCKED until the other
  # catches up — admin-override only. (#278 → #579 → #580 → #588 → #593.)
  ios-required:
    name: iOS + macOS (FinchCore + ParityTests + FinchApp + FinchMac)
    needs: [changes, frontend, guards, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the jobs a PR runs
        run: |
          echo "changes=${{ needs.changes.result }} (code=${{ needs.changes.outputs.code }})"
          echo "frontend=${{ needs.frontend.result }} guards=${{ needs.guards.result }} ios=${{ needs.ios.result }}"
          # If change-detection itself failed, don't green the required check.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::change detection ${{ needs.changes.result }} — refusing to pass"
            exit 1
          fi
          # skipped is a pass in every case: docs-only PRs skip frontend+guards,
          # and ALL pull requests skip ios (post-merge only — see the ios job).
          for pair in "frontend:${{ needs.frontend.result }}" \
                      "guards:${{ needs.guards.result }}" \
                      "ios:${{ needs.ios.result }}"; do
            job="${pair%%:*}" result="${pair#*:}"
            case "$result" in
              success|skipped) echo "$job: $result — ok" ;;
              *) echo "::error::$job $result"; exit 1 ;;
            esac
          done

  # Post-merge red must be LOUD. The `ios` job is the only systematic coverage
  # of the UI tests, macOS and watchOS now, nothing blocks on it, and a failure
  # email is easy to miss — so a red push run files (or updates) a pinned issue
  # labeled `post-merge-red`, and the next green push run closes it. Ubuntu:
  # this must not wait in the macOS queue behind the thing it reports on.
  postmerge-alarm:
    name: Post-merge red alarm
    needs: [changes, frontend, guards, ios]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: File, update, or close the post-merge-red issue
        run: |
          set -euo pipefail
          failed=""
          for pair in "changes:${{ needs.changes.result }}" \
                      "frontend:${{ needs.frontend.result }}" \
                      "guards:${{ needs.guards.result }}" \
                      "ios:${{ needs.ios.result }}"; do
            if [ "${pair#*:}" = "failure" ]; then failed="$failed ${pair%%:*}"; fi
          done
          run_url="${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
          open_issue="$(gh issue list --label post-merge-red --state open \
                          --json number --jq '.[0].number // empty')"
          if [ -n "$failed" ]; then
            body="$(printf 'Post-merge run [failed](%s) on `%s` at %s — red job(s):%s.\n\nThe base is broken for everyone until this is fixed. This issue closes itself on the next green push run.' \
              "$run_url" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$failed")"
            if [ -n "$open_issue" ]; then
              gh issue comment "$open_issue" --body "$body"
            else
              gh issue create --title "Post-merge CI is red on ${GITHUB_REF_NAME}" \
                --label post-merge-red --body "$body"
            fi
          elif [ -n "$open_issue" ]; then
            # Only a fully-successful run closes it — a cancelled run proves nothing.
            for result in "${{ needs.changes.result }}" "${{ needs.frontend.result }}" \
                          "${{ needs.guards.result }}" "${{ needs.ios.result }}"; do
              [ "$result" = "success" ] || exit 0
            done
            gh issue comment "$open_issue" --body "Green again at ${GITHUB_SHA} — $run_url"
            gh issue close "$open_issue"
          fi
