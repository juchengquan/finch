name: CI

on:
  push:
    branches: [main, feat/frontend]
    # Skip CI for docs-only PUSHES (specs/plans/markdown). A mixed commit that
    # also touches code still runs — paths-ignore only skips when ALL changed
    # files match. Safe on push: branch protection gates pull requests, not
    # pushes, so skipping here can't leave a required check unreported.
    paths-ignore:
      - "**/*.md"
      - "plans/**"
  pull_request:
    # NO paths-ignore here, deliberately — the workflow must ALWAYS trigger so the
    # required status check gets reported. Docs-only PRs are made cheap a different
    # way: the `changes` job (below) detects whether any non-docs file changed, and
    # the expensive `frontend` / `ios` jobs are gated on it. The required check
    # (`iOS + macOS (…)`) is carried by the always-running `ios-required` aggregate,
    # so a docs-only PR gets a green required check in seconds without a macOS run.
    #
    # Do NOT re-add paths-ignore here: it skips the whole workflow, the required
    # check never reports, and the PR blocks forever (a docs-only PR, #579, hit
    # exactly that — `checks: []`, state BLOCKED, admin-override only).

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate: did this change touch anything other than docs (**/*.md, plans/**)?
  # The expensive jobs below run only when it did. This is what makes a docs-only
  # PR skip the full frontend + macOS build without re-introducing the
  # required-check deadlock (see the pull_request comment above).
  changes:
    name: Detect non-docs changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `code` = any changed file that is NOT markdown and NOT under plans/.
          # dorny/paths-filter resolves the PR base / push before automatically.
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!plans/**'

  frontend:
    name: Frontend (typecheck · lint · test · build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Naming check
        run: bun run check:naming

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  ios:
    # The real work. Renamed off the required-check context — the always-running
    # `ios-required` aggregate below carries that name now, so this job can be
    # skipped on docs-only PRs without leaving the required check unreported.
    name: iOS + macOS build & test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # iOS 26 SDK requires Xcode 26.x — use a runner image that ships it. Adjust
    # the image / Xcode selection here if the hosted images change.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git-restore-mtime can date each file

      # Stamp each source file with its last-commit mtime. Without this, checkout
      # marks every file "now" — newer than any cached build object — so Xcode and
      # SwiftPM recompile everything even with a warm cache, defeating the
      # DerivedData cache below. With it, only files changed in this push look
      # newer, so unchanged files reuse their cached objects (true incremental).
      - name: Restore source mtimes (enables incremental build caching)
        run: |
          # git-restore-mtime is a standalone script (not on PyPI). Pinned to a
          # commit SHA for reproducibility/supply-chain safety.
          curl -fsSL -o /tmp/git-restore-mtime \
            https://raw.githubusercontent.com/MestreLion/git-tools/b5822d297b3ca4a3b6574e78327a464790b14937/git-restore-mtime
          python3 /tmp/git-restore-mtime ios

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # i18n guard 1 of 2 — the CHEAP one (no Xcode, seconds).
      # Localizable.xcstrings is GENERATED. Hand-editing it is what let 214
      # translations end up living only in the generated file, where a routine
      # regenerate silently destroyed 69 of them. Rebuild from the committed
      # inputs and fail if the result differs from what's checked in.
      - name: i18n — catalog is reproducible from its inputs
        working-directory: ios
        run: |
          bun run scripts/build-xcstrings.ts
          if ! git diff --quiet -- FinchApp/Sources/FinchApp/Resources/Localizable.xcstrings; then
            git diff --stat -- FinchApp/Sources/FinchApp/Resources/Localizable.xcstrings
            echo "::error file=ios/FinchApp/Sources/FinchApp/Resources/Localizable.xcstrings::Localizable.xcstrings does not match a fresh build from its inputs. It is GENERATED — put translations in ios/scripts/zh-manual.json, then run: bun run ios/scripts/build-xcstrings.ts"
            exit 1
          fi

      - name: Install web deps + generate fixtures (Task 0 oracle)
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun scripts/export-fixtures.ts

      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"

      # Cache the SwiftPM build (GRDB et al.) so `swift test` doesn't recompile
      # dependencies from scratch each run. Keyed on the resolved dependency
      # graph; our own sources still rebuild incrementally.
      - name: Cache SwiftPM build (swift test)
        uses: actions/cache@v4
        with:
          path: |
            ios/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: FinchCore unit tests + ParityTests (swift test)
        working-directory: ios
        run: swift test

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9][0-9A-Za-z ]*' | head -1 | xargs)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"

      # Cache Xcode's resolved SwiftPM checkouts so the FinchApp/FinchMac builds
      # don't re-clone/re-resolve GRDB et al. Both xcodebuild steps share one
      # -derivedDataPath (/tmp/dd).
      - name: Cache Xcode SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: /tmp/dd/SourcePackages
          key: xcspm-${{ runner.os }}-${{ hashFiles('ios/Package.resolved') }}
          restore-keys: |
            xcspm-${{ runner.os }}-

      # EXPERIMENT: cache Xcode's compiled intermediates (.o / .swiftmodule +
      # per-file incremental build records) + the clang module cache so the three
      # app builds recompile only what changed instead of from scratch. Only the
      # Intermediates are cached (not the large linked Products, which relink
      # cheaply from cached objects). Rolling key (github.sha never matches, so a
      # fresh cache saves each run) + restore-keys to pull the most recent one.
      # Effectiveness hinges on the mtime restore above — measured before keeping.
      - name: Cache Xcode DerivedData (incremental compile)
        uses: actions/cache@v4
        with:
          path: |
            /tmp/dd/Build/Intermediates.noindex
            /tmp/dd/ModuleCache.noindex
          key: dd-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            dd-${{ runner.os }}-

      - name: Build + test FinchApp
        working-directory: ios
        run: |
          xcodebuild test -project FinchApp.xcodeproj -scheme FinchApp \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath /tmp/dd \
            -skipPackagePluginValidation -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO

      # i18n guard 2 of 2 — needs a compile, so it runs here where /tmp/dd is
      # already warm from the build above. Catches the OTHER failure mode: a new
      # UI string that never reaches extracted-keys.json is absent from the
      # catalog entirely and silently renders English. That is how a 70-string
      # backlog accumulated before anyone noticed.
      - name: i18n — extracted keys are current
        working-directory: ios
        run: |
          rm -rf /tmp/finch-loc
          xcodebuild -exportLocalizations -project FinchApp.xcodeproj -scheme FinchApp \
            -localizationPath /tmp/finch-loc -exportLanguage zh-Hans \
            -derivedDataPath /tmp/dd -quiet \
            -skipPackagePluginValidation -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO
          bun run scripts/xliff-keys.ts > /tmp/keys-fresh.json
          # Compare the KEY SET, not the file bytes: what matters is whether any
          # UI string is missing from the catalog, and a set diff also names the
          # offenders instead of printing "N insertions" and leaving you guessing.
          python3 - <<'PYEOF'
          import json, sys
          fresh = set(json.load(open("/tmp/keys-fresh.json")))
          committed = set(json.load(open("scripts/extracted-keys.json")))
          missing = sorted(fresh - committed)   # in the app, absent from the catalog
          stale   = sorted(committed - fresh)   # in the catalog, gone from the app
          if not missing and not stale:
              sys.exit(0)
          for k in missing:
              print(f"  + {k!r}  (in the app, NOT in the catalog -> renders English)")
          for k in stale:
              print(f"  - {k!r}  (in the catalog, no longer in the app)")
          print("::error file=ios/scripts/extracted-keys.json::extracted-keys.json is out of "
                "date with the app's strings (see the +/- list above). Re-run the pipeline in "
                "the header of ios/scripts/build-xcstrings.ts, then commit extracted-keys.json "
                "AND the rebuilt catalog.")
          sys.exit(1)
          PYEOF

      # Compile the native macOS app too — the iOS app build won't catch
      # macOS-only breaks (e.g. .topBarTrailing is unavailable on macOS).
      # Build-only (no signing needed) — this is a compile gate, not a release.
      # Shares /tmp/dd so it reuses the resolved package checkouts above.
      - name: Build FinchMac (macOS)
        working-directory: ios
        run: |
          xcodebuild build -project FinchApp.xcodeproj -scheme FinchMac \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath /tmp/dd \
            -skipPackagePluginValidation -skipMacroValidation -quiet \
            COMPILER_INDEX_STORE_ENABLE=NO

      # Compile the watch app + its complication extension (Watch CP1/CP2) —
      # neither is covered by the FinchApp/FinchMac builds, and watchOS-only
      # APIs (WidgetKit accessory families, WCSession receive side) can break
      # silently otherwise. Build-only compile gate, no watch tests.
      - name: Build FinchWatch (watchOS)
        working-directory: ios
        run: |
          xcodebuild build -project FinchApp.xcodeproj -scheme FinchWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath /tmp/dd \
            -skipPackagePluginValidation -skipMacroValidation -quiet \
            COMPILER_INDEX_STORE_ENABLE=NO

  # The REQUIRED status check on feat/frontend. Its NAME is what branch protection
  # requires, so it must ALWAYS run and always report — hence `if: always()` and a
  # cheap ubuntu runner. It passes iff the real `ios` job SUCCEEDED (code changed
  # and the build/tests were green) or was SKIPPED (docs-only PR, nothing to run).
  # This is the piece that lets docs-only PRs skip the macOS build while keeping
  # the required check reported in seconds — no #579-style deadlock.
  #
  # KEEP THIS JOB'S `name:` EXACTLY EQUAL to the required-check context configured
  # in branch protection. If you rename it, update branch protection in lockstep,
  # or every PR blocks forever waiting on a status that no longer reports.
  ios-required:
    name: iOS + macOS (FinchCore + ParityTests + FinchApp + FinchMac)
    needs: [changes, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the iOS build result
        run: |
          echo "changes=${{ needs.changes.result }} (code=${{ needs.changes.outputs.code }}), ios=${{ needs.ios.result }}"
          # If change-detection itself failed, don't green the required check.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::change detection ${{ needs.changes.result }} — refusing to pass"
            exit 1
          fi
          case "${{ needs.ios.result }}" in
            success)  echo "iOS build & test passed." ;;
            skipped)  echo "Docs-only change — iOS build skipped, required check satisfied." ;;
            *)        echo "::error::iOS build & test ${{ needs.ios.result }}"; exit 1 ;;
          esac
