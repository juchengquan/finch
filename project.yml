name: FinchApp
options:
  bundleIdPrefix: com.juchengquan
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
packages:
  FinchCore:
    path: .                      # the local SwiftPM package (Package.swift)
targets:
  FinchApp:
    type: application
    platform: iOS
    sources:
      - path: FinchApp/Sources/FinchShared
      - path: FinchApp/Sources/FinchAppSwiftUI
        excludes:
          # The SwiftUI `App` entry point — macOS only now; iOS boots from
          # FinchAppUIKit/UIKitShell.swift (Phase 1 of the UIKit migration).
          - "FinchApp.swift"
      - path: FinchApp/Sources/FinchAppUIKit
      - path: Shared
    dependencies:
      - package: FinchCore
        product: FinchCore
      - target: FinchWidget   # Phase 7 — embed the widget extension
      - target: FinchShare    # Phase 6.5 — embed the share extension
    postBuildScripts:
      - name: Stamp git hash (Debug)
        # Always run: the commit can change without any input file changing.
        basedOnDependencyAnalysis: false
        # Names the built plist the script writes into, which is what ORDERS this
        # phase after `ProcessInfoPlistFile`. Without it the build system, which
        # schedules on declared inputs rather than phase position, is free to run
        # the script first — it then finds no plist, exits 0 by design, and the
        # plist is written fresh with no hash. The ordering was genuinely
        # nondeterministic: back-to-back clean builds of the same tree put the
        # script before the plist and after it, so it read as flakiness.
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)
        script: |
          "$SRCROOT/scripts/stamp-git-hash.sh"
    settings:
      base:
        # Reference the hand-authored Info.plist (with the .finch UTI
        # declarations) directly — do NOT use the `info:` block, which would
        # GENERATE over it and wipe the UTI/document-type keys.
        INFOPLIST_FILE: FinchApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.juchengquan.finch
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FinchApp/FinchApp.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        # Let the compiler extract LocalizedStringKey literals so the String
        # Catalog (Resources/Localizable.xcstrings) drives en/zh-Hans.
        SWIFT_EMIT_LOC_STRINGS: "YES"

  # Phase 7 — WidgetKit extension. Builds for the simulator without signing
  # (CODE_SIGNING_ALLOWED: NO); reads the WidgetSnapshot from the App Group.
  FinchWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FinchWidget
    dependencies:
      - package: FinchCore
        product: FinchCore
    settings:
      base:
        INFOPLIST_FILE: FinchWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.juchengquan.finch.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FinchWidget/FinchWidget.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        SKIP_INSTALL: "NO"

  # Phase 6.5 — Share Extension (receipt photos/PDFs → staged to the App Group).
  FinchShare:
    type: app-extension
    platform: iOS
    sources:
      - path: FinchShare
    dependencies:
      - package: FinchCore
        product: FinchCore
    settings:
      base:
        INFOPLIST_FILE: FinchShare/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.juchengquan.finch.share
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FinchShare/FinchShare.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        SKIP_INSTALL: "NO"

  # Phase 7 — the Apple Watch glance (self-contained watchOS app; reads the
  # WidgetSnapshot from the App Group). Built for the watchOS simulator.
  FinchWatch:
    type: application
    platform: watchOS
    sources:
      - path: FinchWatch
      - path: Shared
    dependencies:
      - target: FinchWatchComplication   # Watch CP2 — embed the complication
    settings:
      base:
        INFOPLIST_FILE: FinchWatch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.juchengquan.finch.watch
        PRODUCT_NAME: finch
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: FinchWatch/FinchWatch.entitlements
        DEVELOPMENT_TEAM: 2WDR2437MU
        CODE_SIGN_STYLE: Automatic

  # Watch CP2 — the watch-face complication (WidgetKit accessory families).
  # Reads the snapshot WatchSnapshotStore persists to the watch App Group;
  # FinchCore-free like the rest of the watch stack.
  FinchWatchComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: FinchWatchComplication
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: FinchWatchComplication/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.juchengquan.finch.watch.complication
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FinchWatchComplication/FinchWatchComplication.entitlements
        DEVELOPMENT_TEAM: 2WDR2437MU
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "NO"

  FinchAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FinchApp/Tests/FinchAppTests
        excludes: ["Fixtures"]
      # Folder reference (blue) — preserves the Fixtures/roundtrip/ hierarchy in
      # the bundle so Bundle(for:).url(..., subdirectory:) resolves it.
      - path: FinchApp/Tests/FinchAppTests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FinchApp

  # UI-test bundle — a SEPARATE target from FinchAppTests: UI tests run in their own
  # runner process that *launches* the host app, while unit tests load in-process and
  # reach FinchApp's singletons directly. Mixing them would break the unit tests (no
  # FinchStore.shared in a separate runner). It also means the host process does NOT
  # load XCTestCase, so FinchStore's temp-dir guard is inactive there — which is why
  # these tests must pass `-resetStore YES`; see LaunchSequence.
  FinchAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FinchApp/Tests/FinchAppUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FinchApp

  FinchCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FinchCore/Tests/FinchCoreTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: FinchCore
        product: FinchCore
schemes:
  FinchApp:
    build:
      targets:
        FinchApp: all
    test:
      targets: [FinchAppTests, FinchAppUITests, FinchCoreTests]
  # NOTE: no FinchMac scheme here — the macOS app lives in its own project
  # (project-mac.yml -> FinchMac.xcodeproj). See that file for why.
  FinchWatch:
    build:
      targets:
        FinchWatch: all
