name: FinchApp
options:
  bundleIdPrefix: com.juchengquan
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
packages:
  FinchCore:
    path: .                      # the local SwiftPM package (Package.swift)
targets:
  FinchApp:
    type: application
    platform: iOS
    sources:
      - path: FinchApp/Sources/FinchApp
      - path: Shared
    dependencies:
      - package: FinchCore
        product: FinchCore
      - target: FinchWidget   # Phase 7 — embed the widget extension
      - target: FinchShare    # Phase 6.5 — embed the share extension
    settings:
      base:
        # Reference the hand-authored Info.plist (with the .finch UTI
        # declarations) directly — do NOT use the `info:` block, which would
        # GENERATE over it and wipe the UTI/document-type keys.
        INFOPLIST_FILE: FinchApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.juchengquan.finch
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FinchApp/FinchApp.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        # Let the compiler extract LocalizedStringKey literals so the String
        # Catalog (Resources/Localizable.xcstrings) drives en/zh-Hans.
        SWIFT_EMIT_LOC_STRINGS: "YES"

  # Phase 7 — WidgetKit extension. Builds for the simulator without signing
  # (CODE_SIGNING_ALLOWED: NO); reads the WidgetSnapshot from the App Group.
  FinchWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FinchWidget
    dependencies:
      - package: FinchCore
        product: FinchCore
    settings:
      base:
        INFOPLIST_FILE: FinchWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.juchengquan.finch.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FinchWidget/FinchWidget.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        SKIP_INSTALL: "NO"

  # Phase 6.5 — Share Extension (receipt photos/PDFs → staged to the App Group).
  FinchShare:
    type: app-extension
    platform: iOS
    sources:
      - path: FinchShare
    dependencies:
      - package: FinchCore
        product: FinchCore
    settings:
      base:
        INFOPLIST_FILE: FinchShare/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.juchengquan.finch.share
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FinchShare/FinchShare.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        SKIP_INSTALL: "NO"

  # Phase 3 — the macOS app. Shares the SAME SwiftUI sources as the iOS app; the
  # iOS-only modifiers are shimmed in Common/PlatformCompat.swift (#if os(macOS)).
  # Built locally for macOS (the iOS CI scheme doesn't build it).
  FinchMac:
    type: application
    platform: macOS
    sources:
      - path: FinchApp/Sources/FinchApp
      - path: Shared   # Foundation-only watch wire types; unguarded references (e.g. QuickAddCatalogBuilder) must resolve on macOS too
    dependencies:
      - package: FinchCore
        product: FinchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juchengquan.finch.mac
        PRODUCT_NAME: finch
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: FinchApp/FinchMac.entitlements
        # Ad-hoc "Sign to Run Locally" — no Development Team needed, so ⌘R / a
        # local build produces a runnable signed app (Apple Silicon requires at
        # least an ad-hoc signature to launch). App Sandbox signs fine ad-hoc; the
        # team-only App Group was dropped from FinchMac.entitlements. CI doesn't
        # build FinchMac, so this is local-only. For real distribution, set a
        # Development Team + restore the App Group.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_EMIT_LOC_STRINGS: "YES"

  # Phase 7 — the Apple Watch glance (self-contained watchOS app; reads the
  # WidgetSnapshot from the App Group). Built for the watchOS simulator.
  FinchWatch:
    type: application
    platform: watchOS
    sources:
      - path: FinchWatch
      - path: Shared
    dependencies:
      - target: FinchWatchComplication   # Watch CP2 — embed the complication
    settings:
      base:
        INFOPLIST_FILE: FinchWatch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.juchengquan.finch.watch
        PRODUCT_NAME: finch
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: FinchWatch/FinchWatch.entitlements
        DEVELOPMENT_TEAM: 2WDR2437MU
        CODE_SIGN_STYLE: Automatic

  # Watch CP2 — the watch-face complication (WidgetKit accessory families).
  # Reads the snapshot WatchSnapshotStore persists to the watch App Group;
  # FinchCore-free like the rest of the watch stack.
  FinchWatchComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: FinchWatchComplication
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: FinchWatchComplication/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.juchengquan.finch.watch.complication
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FinchWatchComplication/FinchWatchComplication.entitlements
        DEVELOPMENT_TEAM: 2WDR2437MU
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "NO"

  FinchAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FinchApp/Tests/FinchAppTests
        excludes: ["Fixtures"]
      # Folder reference (blue) — preserves the Fixtures/roundtrip/ hierarchy in
      # the bundle so Bundle(for:).url(..., subdirectory:) resolves it.
      - path: FinchApp/Tests/FinchAppTests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FinchApp

  FinchCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FinchCore/Tests/FinchCoreTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: FinchCore
        product: FinchCore
schemes:
  FinchApp:
    build:
      targets:
        FinchApp: all
    test:
      targets: [FinchAppTests, FinchCoreTests]
  FinchMac:
    build:
      targets:
        FinchMac: all
  FinchWatch:
    build:
      targets:
        FinchWatch: all
